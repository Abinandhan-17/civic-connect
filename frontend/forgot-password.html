<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Civic Connect</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

<div class="auth-wrap">

<div class="city-grid" style="position:fixed;"></div>

<div class="glass auth-card" style="position:relative;z-index:1;">

<div class="auth-logo">
<i class="fa-solid fa-key" style="color:var(--amber);"></i>
RESET PASSWORD
</div>

<p class="text-muted center" style="margin-bottom:25px;">
Recover your account in three simple steps.
</p>

<!-- STEP 1 -->

<div id="step1">

<div class="field">

<label>Email Address</label>

<div class="input-icon-wrap">
<i class="fa-solid fa-envelope"></i>
<input
class="input"
type="email"
id="email"
placeholder="Enter your registered email"
required>
</div>

</div>

<button class="btn btn-primary btn-block" onclick="sendOtp()">
<i class="fa-solid fa-paper-plane"></i>
Send Verification Code
</button>

</div>

<!-- STEP 2 -->

<div id="step2" class="hidden">

<p class="text-muted center">

Demo OTP

</p>

<div
id="otpDisplay"
class="glass center mono"
style="padding:15px;font-size:28px;letter-spacing:5px;color:var(--teal);margin-bottom:20px;">
------
</div>

<div class="field">

<label>Enter OTP</label>

<input
class="input"
id="otpInput"
placeholder="Enter OTP">

</div>

<button class="btn btn-primary btn-block" onclick="verifyOtp()">
Verify OTP
</button>

</div>

<!-- STEP 3 -->

<div id="step3" class="hidden">

<div class="field">

<label>New Password</label>

<div class="input-icon-wrap">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="newPassword"
class="input"
placeholder="Minimum 6 characters">

</div>

</div>

<button class="btn btn-primary btn-block" onclick="resetPassword()">

Reset Password

</button>

</div>

<div class="divider"></div>

<p class="center">

<a href="login.html">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

</p>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/grid-bg.js"></script>

<script>

let currentEmail="";
let currentOtp="";

async function sendOtp(){

currentEmail=document.getElementById("email").value.trim();

if(currentEmail===""){

Swal.fire({
icon:"warning",
title:"Email Required",
text:"Please enter your registered email."
});

return;

}

try{

const res=await AuthAPI.forgotPassword(currentEmail);

currentOtp=res.otp;

document.getElementById("otpDisplay").innerHTML=currentOtp;

document.getElementById("step1").classList.add("hidden");
document.getElementById("step2").classList.remove("hidden");

Swal.fire({
icon:"success",
title:"OTP Generated",
text:"Demo OTP displayed below."
});

}

catch(err){

Swal.fire({
icon:"error",
title:"Error",
text:err.message
});

}

}

function verifyOtp(){

const entered=document.getElementById("otpInput").value.trim();

if(entered!==currentOtp){

Swal.fire({
icon:"error",
title:"Invalid OTP"
});

return;

}

document.getElementById("step2").classList.add("hidden");
document.getElementById("step3").classList.remove("hidden");

}

async function resetPassword(){

const newPassword=document.getElementById("newPassword").value;

if(newPassword.length<6){

Swal.fire({
icon:"warning",
title:"Password Too Short",
text:"Password must contain at least 6 characters."
});

return;

}

try{

await AuthAPI.resetPassword(

currentEmail,
currentOtp,
newPassword

);

Swal.fire({

icon:"success",
title:"Password Updated Successfully"

}).then(()=>{

window.location.href="login.html";

});

}

catch(err){

Swal.fire({

icon:"error",
title:"Reset Failed",
text:err.message

});

}

}

</script>

</body>
</html>
