<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Civic Connect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="city-grid" style="position:fixed;"></div>
  <div class="glass auth-card" style="position:relative; z-index:1;">
    <div class="auth-logo"><i class="fa-solid fa-key" style="color:var(--amber);"></i> RESET PASSWORD</div>
    <p class="text-muted center" style="margin-bottom:26px;">We'll help you get back in, step by step.</p>

    <div id="step1">
      <div class="field">
        <label>Registered Email</label>
        <div class="input-icon-wrap"><i class="fa-solid fa-envelope"></i><input class="input" type="email" id="email" placeholder="you@example.com" required></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="sendOtp()"><i class="fa-solid fa-paper-plane"></i> Send Verification Code</button>
    </div>

    <div id="step2" class="hidden">
      <p class="text-muted" style="margin-bottom:14px; font-size:.85rem;">A 6-digit demo code has been generated. For this prototype it is shown below instead of sent by SMS/Email.</p>
      <div class="glass center mono" style="padding:14px; margin-bottom:18px; font-size:1.4rem; letter-spacing:4px; color:var(--teal);" id="otpDisplay">------</div>
      <div class="field">
        <label>Enter Code</label>
        <input class="input" id="otpInput" placeholder="6-digit code" maxlength="6">
      </div>
      <button class="btn btn-primary btn-block" onclick="verifyOtp()"><i class="fa-solid fa-check"></i> Verify Code</button>
    </div>

    <div id="step3" class="hidden">
      <div class="field">
        <label>New Password</label>
        <div class="input-icon-wrap"><i class="fa-solid fa-lock"></i><input class="input" type="password" id="newPass" placeholder="Minimum 6 characters" minlength="6"></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="resetPass()"><i class="fa-solid fa-rotate"></i> Reset Password</button>
    </div>

    <div class="divider"></div>
    <p class="center text-muted"><a href="login.html" style="color:var(--teal); font-weight:600;"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/grid-bg.js"></script>
<script>
let generatedOtp = null, targetEmail = null;
function sendOtp(){
  targetEmail = document.getElementById('email').value.trim();
  const user = UsersAPI.findByEmail(targetEmail);
  if(!user){ Swal.fire({icon:'error', title:'Not found', text:'No account with that email.', background:'var(--bg-1)', color:'var(--text-hi)'}); return; }
  generatedOtp = String(Math.floor(100000 + Math.random()*900000));
  document.getElementById('otpDisplay').textContent = generatedOtp;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
}
function verifyOtp(){
  if(document.getElementById('otpInput').value.trim() === generatedOtp){
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
  } else {
    Swal.fire({icon:'error', title:'Incorrect code', background:'var(--bg-1)', color:'var(--text-hi)'});
  }
}
function resetPass(){
  const pass = document.getElementById('newPass').value;
  if(pass.length < 6){ Swal.fire({icon:'warning', title:'Too short', text:'Use at least 6 characters.', background:'var(--bg-1)', color:'var(--text-hi)'}); return; }
  UsersAPI.resetPassword(targetEmail, pass);
  Swal.fire({icon:'success', title:'Password updated', background:'var(--bg-1)', color:'var(--text-hi)', confirmButtonColor:'#17d6c4'}).then(()=> window.location.href='login.html');
}
</script>
</body>
</html>
